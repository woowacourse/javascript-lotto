<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="step2-index.js"></script>
    <title>Lotto</title>
  </head>
  <body>
    <header><h1>🎱 행운의 로또</h1></header>
    <main>
      <div>
        <section><h2>🎱 내 번호 당첨 확인 🎱</h2></section>
        <section>
          <div>
            <span>구입할 금액을 입력해주세요.</span>
            <div>
              <input
                type="text"
                name=""
                id="purchase-input"
                placeholder="금액"
              />
              <button id="purchase-button"><span>구입</span></button>
            </div>
          </div>
        </section>
        <section>
          <span id="lotto-count-message"></span>
          <ul id="generated-lottos"></ul>
        </section>
        <section>
          <span>지난 주 당첨번호 6개와 보너스 번호 1개를 입력해주세요.</span>
          <div>
            <div>
              <span>당첨 번호</span>
              <span>보너스 번호</span>
            </div>
            <div>
              <input type="text" name="" id="winning-number-1" />
              <input type="text" name="" id="winning-number-2" />
              <input type="text" name="" id="winning-number-3" />
              <input type="text" name="" id="winning-number-4" />
              <input type="text" name="" id="winning-number-5" />
              <input type="text" name="" id="winning-number-6" />
              <input type="text" name="" id="bonus-number" />
            </div>
          </div>
        </section>
        <section>
          <button id="result-button"><span>결과 확인하기</span></button>
        </section>
      </div>
    </main>
    <footer><span>Copyright 2023. woowacourse</span></footer>
  </body>
</html>
