<div>
  <h3>지난 주 당첨번호 6개와 보너스 번호 1개를 입력해주세요.</h3>
  <form id="winningLotto-numbersInput-form">
    <div id="winningLotto-numbersInput-container">
      <div>
        <label
          for="winningLotto-winningNumbers"
          id="winningLotto-winningNumbers-label"
          >당첨 번호</label
        >
        <input
          type="text"
          id="winningLotto-winningNumbers"
          autocomplete="one-time-code"
          inputmode="numeric"
        />
      </div>
      <div>
        <label
          for="winningLotto-bonusNumber"
          id="winningLotto-bonusNumber-label"
          >보너스 번호</label
        >
        <input
          type="text"
          id="winningLotto-bonusNumber"
          autocomplete="one-time-code"
          inputmode="numeric"
        />
      </div>
      <button type="submit" id="winningLotto-submitNumbersButton">
        결과 확인하기
      </button>
    </div>
  </form>
</div>
