<div>
  <h3 id="winningLotto-numbersInput-message">
    지난 주 당첨번호 6개와 보너스 번호 1개를 입력해주세요.
  </h3>
  <form id="winningLotto-numbersInput-form">
    <div id="winningLotto-numbersInput-container">
      <div id="winningLotto-winningNumbers-container">
        <label
          for="winningLotto-winningNumbers"
          id="winningLotto-winningNumbers-label"
          >당첨 번호</label
        >
        <input
          type="text"
          id="winningLotto-winningNumbers"
          autocomplete="one-time-code"
          inputmode="numeric"
        />
      </div>
      <div id="winningLotto-bonusNumber-container">
        <label
          for="winningLotto-bonusNumber"
          id="winningLotto-bonusNumber-label"
          >보너스 번호</label
        >
        <input
          type="text"
          id="winningLotto-bonusNumber"
          autocomplete="one-time-code"
          inputmode="numeric"
        />
      </div>
    </div>
  </form>
</div>
