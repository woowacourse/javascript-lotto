<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>🎱 행운의 로또</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <div id="app">
      <header>
        <h1>🎱 행운의 로또</h1>
      </header>
      <main>
        <div class="card">
          <h2>🎱 내 번호 당첨 확인 🎱</h2>

          <section class="purchase-section">
            <form class="purchase-amount-form">
              <div class="input-title">
                <p>구입할 금액을 입력해주세요.</p>
                <input placeholder="금액" class="purchase-amount-input" />
              </div>

              <button type="submit" class="purchase-amount-button">구입</button>
            </form>
            <!-- 구입 금액 입력 -->
          </section>

          <section class="purchased-lotto-section">
            <!-- 구매한 로또 목록 -->
          </section>

          <section class="winning-section">
            <!-- 당첨번호 + 보너스번호 입력 -->
            <button class="result-btn">결과 확인하기</button>
          </section>
        </div>
      </main>
      <div>
        <!-- 모달 -->
      </div>
      <footer>
        <!-- 푸터 -->
      </footer>
    </div>
    <script type="module" src="./src/step2-index.js"></script>
  </body>
</html>
