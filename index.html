<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>🎱 행운의 로또</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <div id="app">
      <h1>🎱 행운의 로또</h1>
    </div>

    <div>
      <h1>내 번호 당첨 확인</h1>
    </div>

    <form>
      <label for="purchaseInput">구입할 금액을 입력해주세요.</label>
      <input type="number" id="purchaseInput" placeholder="금액" />
      <button type="button" id="purchaseButton">구입</button>
    </form>

    <div id="myLotto">
      <ul id="myLottoLists">
      </ul>
    </div>

    <div id="winningDiv" style="display: none;">
      <p>지난 주 당첨번호 6개와 보너스 번호 1개를 입력해주세요.</p>
      <form>
        <label for="winningInput">당첨 번호</label>
        <div>
          <input type="number" class="winningInput"/>
          <input type="number" class="winningInput"/>
          <input type="number" class="winningInput"/>
          <input type="number" class="winningInput"/>
          <input type="number" class="winningInput"/>
          <input type="number" class="winningInput"/>
        </div>
        
      </form>
      <form>
        <label for="bonusInput">보너스 번호</label>
        <input type="number" id="bonusInput"/>
      </form>
    </div>

    <button type="submit" id="getResultButton" style="display: none;">결과 확인하기</button>
    
    <div id="resultModal">
      <h1>🏆 당첨 통계 🏆</h1>
      <table>
        <th>일치 갯수</th>
        <th>당첨금</th>
        <th>당첨 갯수</th>
        <tr>
          <td>3개</td>
          <td class="prizeMoney" id="5thPrizeMoney"></td>
          <td class="winningCount" id="5thWinningCount"></td>
        </tr>
        <tr>
          <td>4개</td>
          <td class="prizeMoney" id="4thPrizeMoney"></td>
          <td class="winningCount" id="4thWinningCount"></td>
        </tr>
        <tr>
          <td>5개</td>
          <td class="prizeMoney" id="3rdPrizeMoney"></td>
          <td class="winningCount" id="3rdWinningCount"></td>
        </tr>
        <tr>
          <td>5개+보너스볼</td>
          <td class="prizeMoney" id="2ndPrizeMoney"></td>
          <td class="winningCount" id="2ndWinningCount"></td>
        </tr>
        <tr>
          <td>6개</td>
          <td class="prizeMoney" id="1stPrizeMoney"></td>
          <td class="winningCount" id="1stWinningCount"></td>
        </tr>
      </table>
      <p id="profitP"></p>
      <button type="button" id="retryButton">다시 시작하기</button>
    </div>
    
    <script type="module" src="./src/step2-index.js"></script>
  </body>
</html>
