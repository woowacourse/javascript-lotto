<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>🎱 행운의 로또</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./index.css" />
    <title>Document</title>
  </head>

  <body>
    <div id="app">
      <header class="header">
        <h1>🎱 행운의 로또</h1>
      </header>
      <div class="lottobox">
        <h2 id="lotto-title">🎱 내 번호 당첨 확인 🎱</h2>

        <div class="purchaseBox">
          <p id="priceText">구입할 금액을 입력해주세요.</p>

          <div class="purchase-row">
            <input id="inputPrice" placeholder="금액" />
            <button type="button" id="purchaseButton">구입</button>
          </div>
        </div>

        <p id="lotto-count"></p>

        <div class="lottos-print">
          <ul id="lotto-list"></ul>
        </div>

        <div class="winning-lotto">
          <div class="input-numbers-text">
            지난 주 당첨번호 6개와 보너스 번호 1개를 입력해주세요.
          </div>

          <div class="winning-numbers-container">
            <div class="winning-numbers">
              <p id="winning-numbers-text"></p>
              <div>
                <input id="winning-number-input-1" />
                <input id="winning-number-input-2" />
                <input id="winning-number-input-3" />
                <input id="winning-number-input-4" />
                <input id="winning-number-input-5" />
                <input id="winning-number-input-6" />
              </div>
            </div>

            <div class="bonus-number">
              <p id="bonus-number-text"></p>
              <input id="bonus-number-input" />
            </div>
          </div>
        </div>

        <button id="result-button" type="button">결과 확인하기</button>
      </div>
    </div>

    <footer class="footer">
      <hr id="copyrignt-line" />
      <h4 id="copyright-text">Copyright 2023. woowacourse</h4>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@woowacourse/mission-utils@1.0.1/dist/mission-utils.min.js"></script>
    <script type="module" src="./src/step2-index.js"></script>
  </body>
</html>
