<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>🎱 행운의 로또</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header id="page-header">
      <h1>🎱 행운의 로또</h1>
    </header>

    <main>
      <div id="main-title-container">
        <h1 id="main-title">🎱 내 번호 당첨 확인 🎱</h1>
      </div>

      <form id="purchase-form">
        <label for="purchase-input" id="purchase-label"
          >구입할 금액을 입력해주세요.</label
        >
        <section id="purchase-input-button-section">
          <input type="number" id="purchase-input" placeholder="금액" />
          <button type="button" id="purchase-button">구입</button>
        </section>
      </form>

      <section id="myLotto-section">
        <p id="myLotto-count-text"></p>
        <ul id="myLotto-list"></ul>
      </section>

      <section id="winning-bonus-section">
        <p id="winning-bonus-description">
          지난 주 당첨번호 6개와 보너스 번호 1개를 입력해주세요.
        </p>
        <div id="winning-bonus-container">
          <fieldset id="winning-numbers">
            <legend id="winning-numbers-title">당첨 번호</legend>
            <input type="number" class="winning-numbers-input" />
            <input type="number" class="winning-numbers-input" />
            <input type="number" class="winning-numbers-input" />
            <input type="number" class="winning-numbers-input" />
            <input type="number" class="winning-numbers-input" />
            <input type="number" class="winning-numbers-input" />
          </fieldset>

          <fieldset id="bonus-number">
            <legend id="bonus-number-title">보너스 번호</legend>
            <input type="number" id="bonus-number-input" />
          </fieldset>
        </div>
      </section>

      <button type="button" id="result-button">결과 확인하기</button>

      <dialog id="result-modal">
        <span id="result-modal-close">X</span>
        <h1 id="result-modal-title">🏆 당첨 통계 🏆</h1>
        <table id="result-modal-table">
          <thead>
            <th>일치 갯수</th>
            <th>당첨금</th>
            <th>당첨 갯수</th>
          </thead>
          <tbody>
            <tr>
              <td>3개</td>
              <td class="prizeMoney" id="prize-5th"></td>
              <td class="winningCount" id="prize-5th-count"></td>
            </tr>
            <tr>
              <td>4개</td>
              <td class="prizeMoney" id="prize-4th"></td>
              <td class="winningCount" id="prize-4th-count"></td>
            </tr>
            <tr>
              <td>5개</td>
              <td class="prizeMoney" id="prize-3rd"></td>
              <td class="winningCount" id="prize-3rd-count"></td>
            </tr>
            <tr>
              <td>5개+보너스볼</td>
              <td class="prizeMoney" id="prize-2nd"></td>
              <td class="winningCount" id="prize-2nd-count"></td>
            </tr>
            <tr>
              <td>6개</td>
              <td class="prizeMoney" id="prize-1st"></td>
              <td class="winningCount" id="prize-1st-count"></td>
            </tr>
          </tbody>
        </table>
        <p id="profit-ratio-text"></p>
        <button type="button" id="retry-button">다시 시작하기</button>
      </dialog>
    </main>

    <footer>
      <p id="lotto-caption">Copyright 2023. woowacourse</p>
    </footer>

    <script type="module" src="./src/step2-index.js"></script>
  </body>
</html>
