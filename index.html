<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>🎱 행운의 로또</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <title>Document</title>
  </head>

  <body>
    <header id="app" class="header">
      <h1 class="header-title">🎱 행운의 로또</h1>
    </header>
    <div class="container">
      <div class="card">
        <div class="card-header">
          <div class="card-title">🎱 내 번호 당첨 확인 🎱</div>
        </div>
        <div class="card-content">
          <div class="purchase-container">
            <label class="purchase-text">구입할 금액을 입력해주세요.</label>
            <div class="input-container">
              <form class="input-form">
                <input class="input" id="purchase-price" placeholder="금액" />
                <button id="purchase-button" class="purchase-button">
                  구입
                </button>
              </form>
            </div>
          </div>
          <div class="lotto-container">
            <div class="purchase-message"></div>
            <div class="lotto-content"></div>
          </div>
          <div class="lotto-input-container">
            <div>지난 주 당첨번호 6개와 보너스 번호 1개를 입력해주세요</div>
            <div class="num-input-container">
              <form class="input-form">
                <div class="winningnum-container">
                  <label>당첨 번호</label>
                  <div class="input-wrapper">
                    <input class="num-input" />
                    <input class="num-input" />
                    <input class="num-input" />
                    <input class="num-input" />
                    <input class="num-input" />
                    <input class="num-input" />
                  </div>
                </div>
                <div class="bonusnum-container">
                  <label>보너스 번호</label>
                  <input class="num-input" />
                </div>
              </form>
            </div>
            <button class="check-result-btn">결과 확인하기</button>
          </div>
        </div>
      </div>
    </div>
    <footer>
      <div>Copyright 2023. woowacourse</div>
    </footer>
    <script type="module" src="./src/step2-index.js"></script>
  </body>
</html>
