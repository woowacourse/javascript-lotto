<!DOCTYPE html>

<head>

<body>
<div id="app">

    <div class="container">
      <p class="lotto-title">🎱 내 번호 당첨 확인 🎱</p>
      <div class="purchase-amount">
        <div class="purchase-amount-input">

          <input type="text" id="input" placeholder="금액" />

      <div>
        <p class="lotto-count">총 7개를 구매하였습니다.</p>
        <div class="lotto-container">
          <div class="lotto">
            <span class="lotto-img">🎟️</span>

          </div>
          <div class="lotto">
            <span class="lotto-img">🎟️</span>
            <span class="lotto-numbers">12, 28, 22, 37, 19, 23</span>
          </div>
          <div class="lotto">
            <span class="lotto-img">🎟️</span>
            <span class="lotto-numbers">12, 28, 22, 37, 19, 23</span>
          </div>
          <div class="lotto">
            <span class="lotto-img">🎟️</span>
            <span class="lotto-numbers">12, 28, 22, 37, 19, 23</span>
          </div>
          <div class="lotto">
            <span class="lotto-img">🎟️</span>
            <span class="lotto-numbers">12, 28, 22, 37, 19, 23</span>
          </div>
          <div class="lotto">
            <span class="lotto-img">🎟️</span>
            <span class="lotto-numbers">12, 28, 22, 37, 19, 23</span>
          </div>
          <div class="lotto">
            <span class="lotto-img">🎟️</span>
            <span class="lotto-numbers">12, 28, 22, 37, 19, 23</span>
          </div>
        </div>
      </div>
      <div class="winning-number-and-bonus">
        <p class="winning-number-and-bonus-message">지난 주 당첨번호 6개와 보너스 번호 1개를 입력해주세요.</p>
        <div class="winning-number-and-bonus-input">
          <div class="winning-number">
          <label>당첨 번호</label>
          <div class="winning-number-input">
            <input class="number-input" type="text" />
            <input class="number-input" type="text" />

            <input class="number-input" type="text" />
            <input class="number-input" type="text" />

          <label for="bonus">보너스 번호</label>
          <input class="number-input" type="text" id="bonus" />

    <button class="submit" type="button">결과 확인하기</button>
