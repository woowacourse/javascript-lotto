<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>🎱 행운의 로또</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src//step2//css//base.css">
  </head>

  <body>
    <header id="header">
      <nav>
        <h1 class="lotto-title">🎱 행운의 로또</h1>
      </nav>
    </header>
    <main id="app">
        <div id="content-container">
          <div id="content">
            <h2 id="content-title" class="lotto-title">🎱 내 번호 당첨 확인 🎱</h2>
            <div id="purchase-amount-container">
              <form id="purchase-amount-form">
                <div>
                  <label for="purchase-amount" class="text-base">구입할 금액을 입력해주세요.</label>
                  <div class="row-line-between">
                    <input id="purchase-amount" placeholder="금액">
                    <button type="submit">구입</button>
                  </div>
                </div>
              </form>
            </div>
            <div id="lotto-content">
              <p class="text-base">총 7개를 구매하였습니다.</p>
              <ul class="text-base">
                <li><span>🎟️</span> 10, 10, 10, 10, 10 ,10</li>
                <li><span>🎟️</span> 10, 10, 10, 10, 10 ,10</li>
                <li><span>🎟️</span> 10, 10, 10, 10, 10 ,10</li>
                <li><span>🎟️</span> 10, 10, 10, 10, 10 ,10</li>
                <li><span>🎟️</span> 10, 10, 10, 10, 10 ,10</li>
                <li><span>🎟️</span> 10, 10, 10, 10, 10 ,10</li>
                <li><span>🎟️</span> 10, 10, 10, 10, 10 ,10</li>
              </ul>
            </div>
            <div id="winning-lotto">
              <p class="text-base">지난 주 당첨번호 6개와 보너스 번호 1개를 입력해주세요.</p>
              <form>
                <div id="winning-lotto-container">
                  <fieldset>
                    <legend class="text-base">당첨 번호</legend>
                    <input type="number" min="1" max="45">
                    <input type="number" min="1" max="45">
                    <input type="number" min="1" max="45">
                    <input type="number" min="1" max="45">
                    <input type="number" min="1" max="45">
                    <input type="number" min="1" max="45">
                  </fieldset>
                  <div id="bonus-number-container">
                    <label class="text-base">보너스 번호</label>
                    <input type="number" min="1" max="45">
                  </div>
                </div>
                <button type="submit">결과 확인하기</button>
              </form>
            </div>
          </div>
        </div>
    </main>
    <script type="module" src="./src/step2-index.js"></script>
  </body>
</html>
