<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>🎱 행운의 로또</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <div id="app">
      <h1>🎱 행운의 로또</h1>
    </div>

    <div>
      <h1>내 번호 당첨 확인</h1>
    </div>

    <form>
      <label for="purchaseInput">구입할 금액을 입력해주세요.</label>
      <input type="number" id="purchaseInput" placeholder="구입" />
      <button type="button" id="purchaseButton">구입</button>
    </form>

    <div id="myLotto">
      <ul id="myLottoLists">
      </ul>
    </div>

    <div id="winningDiv">
      <p>지난 주 당첨번호 6개와 보너스 번호 1개를 입력해주세요.</p>
      <form>
        <label for="winningInput">당첨 번호</label>
        <input type="text" id="winningInput"/>
      </form>
      <form>
        <label for="bonusInput">보너스 번호</label>
        <input type="text" id="bonusInput"/>
      </form>
    </div>
    <button type="submit">결과 확인하기</button>
    <script type="module" src="./src/step2-index.js"></script>
  </body>
</html>
