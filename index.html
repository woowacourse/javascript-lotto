<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="/global.css">
    <title>🎱 행운의 로또</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/reset.css">
  </head>

  <body>
    <div id="app">
      <header class="header">
       <h1 class="text">🎱 행운의 로또</h1>
      </header>
      <div class="lotto">
         <section class="lotto-head">
           <h1 class="text">🎱 내 번호 당첨 확인 🎱</h1>
         </section>
         <form class="lotto-form">
           <label class="small-text">구입할 금액을 입력해주세요.</label>
           <div class="lotto-input">
             <input placeholder="금액"/>
             <button>구입</button>
           </div>
         </form>
         <section class="lotto-result">
           <p class="small-text">총 7개를 구매하였습니다.</p>
           <div class="lotto-ticket">
             <p class="ticket-text">🎟️</p>
             <p class="small-text">1,2,3,4,5,6</p>
           </div>
         </section>      
       <form class="winning-form">
         <p class="small-text">지난 주 당첨번호 6개와 보너스 번호 1개를 입력해주세요.</p>
         <div class="winning">
           <div class="winning-input">
             <label class="small-text">당첨 번호</label>
             <div class="winning-input-list">
               <input />
               <input />
               <input />
               <input />
               <input />
               <input />
             </div>
           </div>
           <div class="bonus-input">
             <label class="small-text">보너스 번호</label>
             <input />
           </div>
         </div>
         <button>결과 확인하기</button>
       </form>
      </div>
      <footer class="footer">
       Copyright 2023. woowacourse
      </footer>
    </div>
    <script type="module" src="./src/step2-index.js"></script>
  </body>
</html>
