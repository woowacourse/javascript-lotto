<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>🎱 행운의 로또</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/index.css" />
  </head>
  <body>
    <header>
      <h1>🎱 행운의 로또</h1>
    </header>
    <div class="root">
      <div class="app">
        <h2 class="page-title">🎱 내 번호 당첨 확인 🎱</h2>
        <div class="lotto-box">
          <div class="lotto-top">
              <div class="input-container">
                <span class="input-title">구입할 금액을 입력해주세요.</span>
                <input class="input-basic" type="text" />
              </div>
              <div class="button-box">
                <span class="button-text">구입</span>
              </div>
          </div>
          <div class="lotto-middle">
            <div class="lotto-item-quantity">
            </div>
            <div class="lotto-item-container">
            </div>
          </div>
          <div class="lotto-bottom">
            <span>지난 주 당첨번호 6개와 보너스 번호 1개를 입력해주세요.</span>
            <div class="input-container">
              <div class="input-box">
                <span class="input-title">당첨 번호</span>
                <input class="input-basic" type="text" value="1"/>
                <input class="input-basic" type="text" value="2"/>
                <input class="input-basic" type="text" value="3"/>
                <input class="input-basic" type="text" value="4"/>
                <input class="input-basic" type="text" value="5"/>
                <input class="input-basic" type="text" value="6"/>
              </div>
            </div>
            <div class="input-container">
              <div class="input-box">
                <span class="input-title">보너스 번호</span>
                <input class="input-basic" type="text" value="9"/>
              </div>
            </div>
            <div class="button-box">
              <span class="button-text">결과 확인하기</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal">
        <h2>🏆 당첨 통계 🏆</h2>
        <table class="">
          <thead>
            <tr>
              <th>일치 갯수</th>
              <th>당첨금</th>
              <th>당첨 갯수</th>
            </tr>
          </thead>
          <tbody>
          </tbody>
        </table>
        <div class="button-box">
          <span class="다시 시작하기"></span>
        </div>
      </div>
    </div>  
    <script type="module" src="./src/step2-index.js"></script>
  </body>
</html>
