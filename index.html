<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>🎱 행운의 로또</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./src/style/main.css" />
  </head>

  <body>
    <div id="app">
      <header>
        <span class="title">🎱 행운의 로또</span>
      </header>
      <main id="lottoGame">
        <div class="inner">
          <span class="title">🎱 내 번호 당첨 확인 🎱</span>
          <div class="purchase_amount_section">
            <span>구입할 금액을 입력해주세요.</span>
            <div class="purchase_amount">
              <input type="text" id="purchaseAmount" placeholder="금액" />
              <button id="purchaseButton" class="caption">구입</button>
            </div>
          </div>
          <div class="lotto_pack_section">
            <span>총 7개를 구매하였습니다.</span>
            <div class="lotto_pack">
              <div class="lotto">
                <img src="ticket.png" alt="로또" width="34px" height="36px" />
                <span>12, 28, 22, 37, 19, 23</span>
              </div>
              <div class="lotto">
                <img src="ticket.png" alt="로또" width="34px" height="36px" />
                <span>12, 28, 22, 37, 19, 23</span>
              </div>
              <div class="lotto">
                <img src="ticket.png" alt="로또" width="34px" height="36px" />
                <span>12, 28, 22, 37, 19, 23</span>
              </div>
              <div class="lotto">
                <img src="ticket.png" alt="로또" width="34px" height="36px" />
                <span>12, 28, 22, 37, 19, 23</span>
              </div>
              <div class="lotto">
                <img src="ticket.png" alt="로또" width="34px" height="36px" />
                <span>12, 28, 22, 37, 19, 23</span>
              </div>
              <div class="lotto">
                <img src="ticket.png" alt="로또" width="34px" height="36px" />
                <span>12, 28, 22, 37, 19, 23</span>
              </div>
              <div class="lotto">
                <img src="ticket.png" alt="로또" width="34px" height="36px" />
                <span>12, 28, 22, 37, 19, 23</span>
              </div>
            </div>
          </div>
          <div class="answer_lotto_section">
            <span>지난 주 당첨번호 6개와 보너스 번호 1개를 입력해주세요.</span>
            <div class="answer_lotto">
              <div class="answer_lotto_number">
                <span>당첨 번호</span>
                <div class="winning_input">
                  <input type="text" id="winning_number" class="number" maxlength="1" />
                  <input type="text" id="winning_number" class="number" maxlength="1" />
                  <input type="text" id="winning_number" class="number" maxlength="1" />
                  <input type="text" id="winning_number" class="number" maxlength="1" />
                  <input type="text" id="winning_number" class="number" maxlength="1" />
                  <input type="text" id="winning_number" class="number" maxlength="1" />
                </div>
              </div>
              <div class="answer_lotto_number">
                <span>보너스 번호</span>
                <div class="bonus_input">
                  <input type="text" id="bonus_number" class="number" maxlength="1" />
                </div>
              </div>
            </div>
          </div>
          <div class="reuslt_button_section">
            <button id="resultButton" class="caption">결과 확인하기</button>
          </div>
        </div>
      </main>

      <main id="lottoResult">
        <img class="close" src="close.png" alt="x" width="16px" height="16px" />
        <div class="inner">
          <span class="title">🏆 당첨 통계 🏆</span>
        </div>
      </main>

      <footer>
        <span class="caption">Copyright 2025. woowacourse</span>
      </footer>
    </div>
    <script type="module" src="./src/step2-index.js"></script>
  </body>
</html>
