<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>🎱 행운의 로또</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/styles/reset.css" />
    <link rel="stylesheet" href="./src/styles/style.css" />
    <title>Document</title>
  </head>

  <body>
    <div id="app">
      <header id="header-layout">
        <h1 class="header-layout-title title">🎱 행운의 로또</h1>
      </header>
      <main id="main-layout">
        <header class="main-header title">🎱 내 번호 당첨 확인 🎱</header>
        <section class="amount-input-section">
          <h2 class="amount-input-section-title body">
            구입할 금액을 입력해주세요
          </h2>
          <article class="amount-input-article">
            <input
              type="number"
              class="amount-input placeholder"
              placeholder="금액"
            />
            <button class="amount-input-button lotto-caption">구입</button>
          </article>
        </section>
        <section class="lotto-detail-layout">
          <span class="lotto-detail-title body">총 7개를 구매하였습니다.</span>
          <div class="lotto-detail-list">
            <div class="lotto-detail-item body">
              <span class="lotto-detail-item-number"
                ><img src="/src/assets/ic_admit_one.png" />12, 28 ,22 ,37, 19,
                23</span
              >

              <span class="lotto-detail-item-number"
                ><img src="/src/assets/ic_admit_one.png" />12, 28 ,22 ,37, 19,
                23</span
              >
              <span class="lotto-detail-item-number"
                ><img src="/src/assets/ic_admit_one.png" />12, 28 ,22 ,37, 19,
                23</span
              >
            </div>
          </div>
        </section>
        <h2 class="user-input-title body">
          지난 주 당첨번호 6개와 보너스 번호 1개를 입력해주세요.
        </h2>
        <section class="user-input-layout">
          <article class="user-input-win-article body">
            <span class="body">당첨 번호</span>

            <form>
              <input type="number" class="user-input" />
              <input type="number" class="user-input" />
              <input type="number" class="user-input" />
              <input type="number" class="user-input" />
              <input type="number" class="user-input" />
              <input type="number" class="user-input" />
            </form>
          </article>
          <article class="user-input-bonus-article body">
            <span class="body">보너스 번호</span>
            <form class="user-input-bonus-form">
              <input type="number" class="user-input" />
            </form>
          </article>
        </section>
        <section class="results-button-layout">
          <button type="button" class="results-button lotto-caption">
            결과 확인하기
          </button>
        </section>
      </main>
      <footer class="footer lotto-caption">Copyright 2023. woowacourse</footer>
    </div>
    <script type="module" src="./src/step2-index.js"></script>
  </body>
</html>
