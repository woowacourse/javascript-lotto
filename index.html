<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>🎱 행운의 로또</title>
    <link rel="stylesheet" href="src/style/main.css" />
    <link rel="stylesheet" href="src/style/pages/index.css" />
    <link rel="stylesheet" href="src/style/pages/lotto-box.css" />
    <link rel="stylesheet" href="src/style/pages/winning-number.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <header>
      <h1 class="typo-24-EB">🎱 행운의 로또</h1>
    </header>
    <main class="flex-center">
      <section class="lotto-box">
        <h2 class="typo-24-EB flex-center">🎱 내 번호 당첨 확인 🎱</h2>
        <form id="purchase-form">
          <label for="price" class="typo-15-R">구입할 금액을 입력해주세요.</label>
          <div class="purchase-input">
            <input type="number" id="price" placeholder="금액" />
            <button class="typo-14-B">구입</button>
          </div>
          <p class="error-message" id="price-error"></p>
        </form>

        <div class="purchase-result"></div>

        <form id="winning-number-form">
          <p>지난 주 당첨번호 6개와 보너스 번호 1개를 입력해주세요.</p>
          <div class="spacing-12"></div>
          <div class="winning-number-container">
            <div class="winning-number-group">
              <label class="typo-15-R">당첨 번호</label>
              <div class="winning-number-boxes">
                <input type="text" id="winning-1" value="3" class="number-box" maxlength="2" />
                <input type="text" id="winning-2" value="5" class="number-box" maxlength="2" />
                <input type="text" id="winning-3" value="7" class="number-box" maxlength="2" />
                <input type="text" id="winning-4" value="9" class="number-box" maxlength="2" />
                <input type="text" id="winning-5" value="11" class="number-box" maxlength="2" />
                <input type="text" id="winning-6" value="23" class="number-box" maxlength="2" />
              </div>
            </div>

            <div class="bonus-number-group">
              <label for="bonus" class="typo-15-R">보너스 번호</label>
              <input type="text" id="bonus" class="number-box bonus-box" value="23" maxlength="2" />
            </div>
          </div>
          <div class="spacing-4"></div>
          <p class="error-message" id="winning-number-error"></p>
          <div class="spacing-28"></div>
          <button class="typo-14-B">결과 확인하기</button>
        </form>
      </section>
    </main>
    <footer><p class="typo-14-B flex-center">Copyright 2023. woowacourse</p></footer>
    <script src="/src/js/index.js" type="module"></script>
  </body>
</html>
