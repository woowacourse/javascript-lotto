<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>🎱 행운의 로또</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/style.css" />
  </head>

  <body>
    <div class="page-shell">
      <header class="site-header">
        <div class="site-header-inner">
          <p class="site-brand lotto-title">🎱 행운의 로또</p>
        </div>
      </header>

      <main class="site-main">
        <div id="app">
          <h1 class="title lotto-title">🎱 내 번호 당첨 확인 🎱</h1>

          <section class="purchase-section">
            <p class="lotto-body">구입할 금액을 입력해주세요.</p>
            <form class="purchase-form">
              <fieldset class="purchase-fieldset lotto-fieldset">
                <legend class="sr-only">구입 정보</legend>
                <label class="sr-only" for="purchase-amount">구입 금액</label>
                <input
                  id="purchase-amount"
                  name="purchase-amount"
                  type="number"
                  class="purchase-input lotto-input lotto-body"
                  placeholder="금액"
                  max="9007199254740991"
                  required
                />
                <button
                  type="submit"
                  class="purchase-button lotto-button lotto-caption"
                >
                  구입
                </button>
              </fieldset>
            </form>
          </section>

          <section class="lotto-section" hidden>
            <h2 class="sr-only lotto-body">구매한 로또 목록</h2>
            <p class="section-caption lotto-body">
              총 <span class="lotto-count"></span>개를 구매하였습니다.
            </p>
            <ul class="lotto-list lotto-body"></ul>
          </section>

          <section class="winning-section" hidden>
            <p class="lotto-body">
              지난 주 당첨번호 6개와 보너스 번호 1개를 입력해주세요.
            </p>
            <form class="winning-form">
              <fieldset class="winning-field-group lotto-fieldset">
                <legend class="field-label lotto-body">당첨 번호</legend>
                <div class="winning-numbers-group">
                  <label class="sr-only" for="winning-lotto-1"
                    >당첨 번호 1</label
                  >
                  <input
                    id="winning-lotto-1"
                    name="winning-lotto"
                    type="number"
                    class="winning-input lotto-input lotto-body"
                    required
                    aria-label="당첨 번호 1"
                  />
                  <label class="sr-only" for="winning-lotto-2"
                    >당첨 번호 2</label
                  >
                  <input
                    id="winning-lotto-2"
                    name="winning-lotto"
                    type="number"
                    class="winning-input lotto-input lotto-body"
                    required
                    aria-label="당첨 번호 2"
                  />
                  <label class="sr-only" for="winning-lotto-3"
                    >당첨 번호 3</label
                  >
                  <input
                    id="winning-lotto-3"
                    name="winning-lotto"
                    type="number"
                    class="winning-input lotto-input lotto-body"
                    required
                    aria-label="당첨 번호 3"
                  />
                  <label class="sr-only" for="winning-lotto-4"
                    >당첨 번호 4</label
                  >
                  <input
                    id="winning-lotto-4"
                    name="winning-lotto"
                    type="number"
                    class="winning-input lotto-input lotto-body"
                    required
                    aria-label="당첨 번호 4"
                  />
                  <label class="sr-only" for="winning-lotto-5"
                    >당첨 번호 5</label
                  >
                  <input
                    id="winning-lotto-5"
                    name="winning-lotto"
                    type="number"
                    class="winning-input lotto-input lotto-body"
                    required
                    aria-label="당첨 번호 5"
                  />
                  <label class="sr-only" for="winning-lotto-6"
                    >당첨 번호 6</label
                  >
                  <input
                    id="winning-lotto-6"
                    name="winning-lotto"
                    type="number"
                    class="winning-input lotto-input lotto-body"
                    required
                    aria-label="당첨 번호 6"
                  />
                </div>
              </fieldset>

              <fieldset class="bonus-number-group lotto-fieldset">
                <legend class="field-label lotto-body">보너스 번호</legend>
                <label class="sr-only" for="bonus-number">보너스 번호</label>
                <input
                  id="bonus-number"
                  name="bonus-number"
                  type="number"
                  class="bonus-input lotto-input lotto-body"
                  required
                />
              </fieldset>

              <button
                type="submit"
                class="winning-button lotto-button lotto-caption"
              >
                결과 확인하기
              </button>
            </form>
          </section>
        </div>
      </main>

      <footer class="site-footer">
        <div class="site-footer-inner">
          <p class="site-footer-label lotto-caption">
            Copyright 2023. woowacourse
          </p>
        </div>
      </footer>
    </div>

    <div class="modal-overlay" role="presentation" hidden>
      <section
        class="result-modal"
        aria-modal="true"
        aria-labelledby="result-modal-title"
        role="dialog"
      >
        <button class="modal-close-button" type="button" aria-label="모달 닫기">
          &times;
        </button>
        <h2 id="result-modal-title" class="result-modal-title lotto-subtitle">
          🏆 당첨 통계 🏆
        </h2>

        <table class="modal-result-table">
          <caption class="sr-only">
            당첨 통계 표
          </caption>
          <thead class="lotto-body">
            <tr>
              <th>일치 갯수</th>
              <th>당첨금</th>
              <th>당첨 갯수</th>
            </tr>
          </thead>
          <tbody class="lotto-body"></tbody>
        </table>

        <p class="modal-profit-text lotto-body">
          당신의 총 수익률은 <span class="modal-profit-value"></span>%입니다.
        </p>
        <button
          class="modal-retry-button lotto-button lotto-caption"
          type="button"
        >
          다시 시작하기
        </button>
      </section>
    </div>

    <script type="module" src="./src/step2-index.js"></script>
  </body>
</html>
