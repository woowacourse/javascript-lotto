<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>🎱 행운의 로또</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src//step2//css//base.css">
    <link rel="stylesheet" href="./src/step2/css/responsive.css">
  </head>

  <body>
    <header id="header">
      <nav>
        <h1 class="text-title">🎱 행운의 로또</h1>
      </nav>
    </header>
    <main id="app">
      <div id="content-container">
        <div id="content">
          <h2 id="content-title" class="text-title">🎱 내 번호 당첨 확인 🎱</h2>
          <div id="purchase-amount-content">
            <form id="purchase-amount-form">
              <div id="purchase-amount-input-container">
                <label for="purchase-amount" class="text-body">구입할 금액을 입력해주세요.</label>
                <div class="row-line-between">
                  <input id="purchase-amount" class="font-placeholder" placeholder="금액" required>
                  <button type="submit">구입</button>
                </div>
                <div id="purchase-amount-error-message-container"></div>
              </div>
            </form>
          </div>
          <div id="purchase-lotto-content" class="hidden">
          </div>
          <div id="winning-lotto-content" class="hidden">
            <p class="text-body">지난 주 당첨번호 6개와 보너스 번호 1개를 입력해주세요.</p>
            <form id="winning-lotto-form">
              <div id="winning-lotto-inputs-container">
                <div id="winning-lotto-inputs">
                  <fieldset id="winning-lotto-numbers">
                  <legend class="text-body">당첨 번호</legend>
                  <input type="number" min="1" max="45" required>
                  <input type="number" min="1" max="45" required>
                  <input type="number" min="1" max="45" required>
                  <input type="number" min="1" max="45" required>
                  <input type="number" min="1" max="45" required>
                  <input type="number" min="1" max="45" required>
                  </fieldset>
                  <div id="winning-lotto-bonus-number-container">
                    <label for="winning-lotto-bonus-number" class="text-body">보너스 번호</label>
                    <input id="winning-lotto-bonus-number" type="number" min="1" max="45" required>
                  </div>
                </div>
              </div>
              <button type="submit">결과 확인하기</button>
            </form>
          </div>
        </div>
        <dialog id="lotto-match-result-dialog" >
          <form method="dialog">
            <button class="dialog-closer" type="button" aria-label="당첨 통계 닫기">&times;</button>
          </form>
          <h3 class="lotto-subtitle">🏆 당첨 통계 🏆</h3>
          <div id="lotto-match-result-content" class="text-body">
          </div>
        </dialog>
      </div>
    </main>
    <footer>
      <p>Copyright 2023. woowacourse</p>
    </footer>
    <script type="module" src="./src/step2-index.js"></script>
  </body>
</html>
