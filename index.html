<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>🎱 행운의 로또</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/style.css" />
    <title>Document</title>
  </head>

  <body>
    <!-- header -->
    <header>
      <h1>🎱 행운의 로또</h1>
    </header>

    <!-- main -->
    <main>
      <section>
        <title>🎱 내 번호 당첨 확인 🎱</title>

        <!-- purchase-amount-area -->
        <form id="purchase-amount-area">
          <div id="purchase-amount-field">
            <label for="purchase-amount-input"
              >구입할 금액을 입력해주세요.</label
            >
            <div id="purchase-amount-input">
              <input
                id="purchase-amount-input-field"
                name="amount"
                placeholder="금액"
              />
            </div>
          </div>
          <button id="button-purchase" type="submit">구입</button>
        </form>

        <!-- lotto-container -->
        <div id="lotto-container" style="display: none">
          <output id="purchase-amount-output"></output>

          <!-- lotto-list -->
          <div id="lotto-list">
            <ul id="lottos"></ul>
          </div>

          <!-- winning-number-area -->
          <form id="winning-number-area">
            <p>지난 주 당첨번호 6개와 보너스 번호 1개를 입력해주세요.</p>
            <div id="winning-number-inputs">
              <div id="winning-numbers">
                <span>당첨 번호</span>
                <div id="winning-number-fields">
                  <input
                    class="winning-number"
                    name="winning-number"
                    maxlength="2"
                  />
                  <input
                    class="winning-number"
                    name="winning-number"
                    maxlength="2"
                  />
                  <input
                    class="winning-number"
                    name="winning-number"
                    maxlength="2"
                  />
                  <input
                    class="winning-number"
                    name="winning-number"
                    maxlength="2"
                  />
                  <input
                    class="winning-number"
                    name="winning-number"
                    maxlength="2"
                  />
                  <input
                    class="winning-number"
                    name="winning-number"
                    maxlength="2"
                  />
                </div>
              </div>
              <div id="bonus-number">
                <span>보너스 번호</span>
                <input id="bonus-number-input" name="bonus" maxlength="2" />
              </div>
            </div>
            <button id="result-button" type="submit">결과 확인하기</button>
          </form>
        </div>
      </section>
    </main>

    <!-- result-modal -->
    <dialog id="result-modal">
      <div id="modal-header">
        <h2>🏆 당첨 통계 🏆</h2>
        <button id="modal-close-button">✕</button>
      </div>
      <table id="result-table">
        <thead>
          <tr>
            <th>일치 갯수</th>
            <th>당첨금</th>
            <th>당첨 갯수</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>3개</td>
            <td>5,000</td>
            <td><span class="match-count">n</span>개</td>
          </tr>
          <tr>
            <td>4개</td>
            <td>50,000</td>
            <td><span class="match-count">n</span>개</td>
          </tr>
          <tr>
            <td>5개</td>
            <td>1,500,000</td>
            <td><span class="match-count">n</span>개</td>
          </tr>
          <tr>
            <td>5개+보너스볼</td>
            <td>30,000,000</td>
            <td><span class="match-count">n</span>개</td>
          </tr>
          <tr>
            <td>6개</td>
            <td>2,000,000,000</td>
            <td><span class="match-count">n</span>개</td>
          </tr>
        </tbody>
      </table>
      <p id="rate-of-return-text">
        당신의 총 수익률은 <span id="rate-of-return">%</span>입니다.
      </p>
      <button id="restart-button">다시 시작하기</button>
    </dialog>
  </body>
  <!-- footer -->
  <footer>
    <p>Copyright 2023. woowacourse</p>
  </footer>
  <script type="module" src="./src/step2-index.js"></script>
</html>
