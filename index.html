<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>🎱 행운의 로또</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./styles/reset.css" />
  </head>

  <body>
    <div id="app">
      <header class="header"><h1>🎱 행운의 로또</h1></header>
      <div class="screen">
        <h1>🎱내 번호 당첨 확인🎱</h1>
        <div class="priceInputContainer">
          <div class="text">구입할 금액을 입력해주세요</div>
          <div style="display: flex">
            <input class="priceInput" placeholder="금액" />
            <div class="buyButton">구입</div>
          </div>
        </div>
        <div class="whenBuyed" style="display: none">
          <div class="buyedLottos"></div>
          <div class="text">
            지난주 당첨범호 6개와 보너스 번호 1개를 입력해주세요
          </div>
          <div class="enteredNumbers" style="display: flex">
            <div class="lottoNumbers">
              <div>당첨번호</div>
              <div style="display: flex; width: 500px">
                <input style="width: 50px" class="winningNumberInput" />
                <input style="width: 50px" class="winningNumberInput" />
                <input style="width: 50px" class="winningNumberInput" />
                <input style="width: 50px" class="winningNumberInput" />
                <input style="width: 50px" class="winningNumberInput" />
                <input style="width: 50px" class="winningNumberInput" />
              </div>
            </div>
            <div class="bonusNumber">
              <div>보너스 번호</div>
              <input class="bonusNumberInput" />
            </div>
          </div>
          <div class="checkResult">결과 확인하기</div>
        </div>
      </div>
      <dialog>
        <h3>🏆당첨 통계🏆</h3>
        <div
          class="winningHistory"
          style="
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 10px;
            width: 300px;
          "
        >
          <div>일치 개수</div>
          <div>당첨금</div>
          <div>당첨개수</div>
          <div>3개</div>
          <div>5000</div>
          <div id="rank5WinnigCount">0개</div>
          <div>4개</div>
          <div>50,000</div>
          <div id="rank4WinningCount">0개</div>
          <div>5개</div>
          <div>2,000,000,000</div>
          <div id="rank3WinningCount">0개</div>
          <div>5개 + 보너스볼볼</div>
          <div>30,000,000</div>
          <div id="rank2WinningCount">0개</div>
          <div>6개</div>
          <div>1,000,000,000</div>
          <div id="rank1WinningCount">0개</div>
        </div>
        <div id="rate">수익률</div>
        <button id="reset">다시 시작하기</button>
      </dialog>
    </div>
    <script type="module" src="./src/step2-index.js"></script>
  </body>
</html>
