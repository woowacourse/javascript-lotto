<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>🎱 행운의 로또</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style/main.css" />
  </head>

  <body>
    <header>
      <h1 class="title">🎱 행운의 로또</h1>
    </header>

    <main>
      <section>
        <h2 class="title">🎱 내 당첨 번호 확인 🎱</h2>
        <form class="money" action="#">
          <label>구입할 금액을 입력해주세요.</label>
          <div class="money__input">
            <input placeholder="금액" />
            <button class="button caption">구입</button>
          </div>
        </form>

        <div class="lotto">
          <span>총 2개를 구매하였습니다.</span>
          <div class="lotto__number">
            <div class="lotto_number__item">
              <img src="./assets//lotto_ticket.png" />
              <span>1,2,3,4,5,6</span>
            </div>
            <div class="lotto_number__item">
              <img src="./assets//lotto_ticket.png" />
              <span>1,2,3,4,42,43</span>
            </div>
          </div>
        </div>

        <form class="winning-lotto" action="#">
          <div>지난 주 당첨번호 6개와 보너스 번호 1개를 입력해주세요.</div>
          <div class="winning-lotto__container">
            <div class="winning-number">
              <label>당첨 번호</label>
              <div>
                <input />
                <input />
                <input />
                <input />
                <input />
              </div>
            </div>
            <div class="bonus-number">
              <label>보너스 번호</label>
              <input class="winning-lotto__input" />
            </div>
          </div>

          <button class="button caption" onclick="window.myDialog.showModal()">
            결과 확인하기
          </button>
        </form>
      </section>

      <dialog id="myDialog">
        <div class="lotto-result">
          <img
            class="close-icon"
            src="assets/modal_close_icon.png"
            onclick="window.myDialog.close()"
          />
          <h2 class="title">🏆 당첨 통계 🏆</h2>
          <table>
            <thead>
              <tr>
                <th>일치 개수</th>
                <th>당첨금</th>
                <th>당첨 개수</th>
              </tr>
            </thead>
            <tbody>
              <tr class="body">
                <td>3개</td>
                <td>5,000</td>
                <td>n개</td>
              </tr>
              <tr class="body">
                <td>4개</td>
                <td>50,000</td>
                <td>n개</td>
              </tr>
              <tr class="body">
                <td>5개</td>
                <td>1,500,000</td>
                <td>n개</td>
              </tr>
              <tr class="body">
                <td>5개+보너스볼</td>
                <td>30,000,000</td>
                <td>n개</td>
              </tr>
              <tr class="body">
                <td>6개</td>
                <td>2,000,000,000</td>
                <td>n개</td>
              </tr>
            </tbody>
          </table>
          <h3 class="caption">당신의 총 수익률은 %입니다.</h3>
          <button class="button caption">다시 시작하기</button>
        </div>
      </dialog>
    </main>
    <footer>
      <div class="caption">Copyright 2023. woowacourse</div>
    </footer>
    <div id="app"></div>
    <script type="module" src="./src/step2-index.js"></script>
  </body>
</html>
