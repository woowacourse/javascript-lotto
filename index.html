<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>🎱 행운의 로또</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style/main.css" />
  </head>

  <body>
    <header>
      <h1 class="title">🎱 행운의 로또</h1>
    </header>

    <main>
      <section class="lotto-section">
        <h2 class="lotto-section__title title">🎱 내 당첨 번호 확인 🎱</h2>

        <form class="purchase-form" action="#">
          <label class="purchase-form__label body" for="purchase-amount">
            구입할 금액을 입력해주세요.
          </label>
          <div class="purchase-form__input-group">
            <input
              class="purchase-form__input"
              id="purchase-amount"
              placeholder="금액"
              type="number"
              min="1000"
              step="1000"
              required
            />
            <button class="purchase-form__submit-btn button caption">
              구입
            </button>
          </div>
        </form>

        <div class="ticket-list">
          <div class="ticket-list__summary body">총 2개를 구매하였습니다.</div>

          <div class="ticket-list__container"></div>
        </div>

        <form class="winning-form" action="#">
          <div class="winning-form__summary body">
            지난 주 당첨번호 6개와 보너스 번호 1개를 입력해주세요.
          </div>

          <div class="winning-form__container">
            <div class="winning-form__input-group">
              <label class="winning-form__label" for="winning-number-first"
                >당첨 번호</label
              >
              <div class="winning-form__input-list">
                <input
                  class="winning-form__input"
                  id="winning-number-first"
                  type="number"
                  min="1"
                  max="45"
                  maxlength="2"
                  required
                />
                <input
                  class="winning-form__input"
                  id="winning-number-second"
                  type="number"
                  min="1"
                  max="45"
                  maxlength="2"
                  required
                />
                <input
                  class="winning-form__input"
                  id="winning-number-third"
                  type="number"
                  min="1"
                  max="45"
                  maxlength="2"
                  required
                />
                <input
                  class="winning-form__input"
                  id="winning-number-fourth"
                  type="number"
                  min="1"
                  max="45"
                  maxlength="2"
                  required
                />
                <input
                  class="winning-form__input"
                  id="winning-number-fifth"
                  type="number"
                  min="1"
                  max="45"
                  maxlength="2"
                  required
                />
                <input
                  class="winning-form__input"
                  id="winning-number-sixth"
                  type="number"
                  min="1"
                  max="45"
                  maxlength="2"
                  required
                />
              </div>
            </div>

            <div
              class="winning-form__input-group winning-form__input-group--bonus"
            >
              <label class="winning-form__label" for="bonus-number"
                >보너스 번호</label
              >
              <div class="winning-form__input-list">
                <input
                  class="winning-form__input winning-form__input--bonus"
                  id="bonus-number"
                  type="number"
                  min="1"
                  max="45"
                  maxlength="2"
                  required
                />
              </div>
            </div>
          </div>

          <button class="winning-form__submit-btn button caption">
            결과 확인하기
          </button>
        </form>
      </section>

      <dialog class="result-modal">
        <div class="result-modal__content">
          <img class="result-modal__close-btn" src="/modal_close_icon.png" />
          <h2 class="result-modal__title title">🏆 당첨 통계 🏆</h2>
          <table class="result-modal__table">
            <thead class="result-modal__thead">
              <tr class="result-modal__tr">
                <th class="result-modal__th">일치 개수</th>
                <th class="result-modal__th">당첨금</th>
                <th class="result-modal__th">당첨 개수</th>
              </tr>
            </thead>
            <tbody class="result-modal__tbody"></tbody>
          </table>
          <h3 class="result-modal__profit caption">
            당신의 총 수익률은 %입니다.
          </h3>
          <button class="result-modal__submit-btn button caption">
            다시 시작하기
          </button>
        </div>
      </dialog>
    </main>
    <footer>
      <div class="caption">Copyright 2026. woowacourse</div>
    </footer>
    <script type="module" src="./src/step2-index.js"></script>
  </body>
</html>
