<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link href="./src/asset/css/reset.css" rel="stylesheet" />
    <link href="./src/asset/css/style.css" rel="stylesheet" />
    <title>🎱 행운의 로또</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="app">
      <div id="modalBackground">

      </div>
      <header class="header">
        <nav>
          <h1><a id="headerLogo">🎱 행운의 로또</a></h1>
        </nav>
      </header>

      <div class="container">
        <div class="lotto-box">
          <h1>🎱 내 번호 당첨 확인 🎱</h1>
            <form id="priceForm" class="price-form">
              <label for="price">구입할 금액을 입력해주세요.</label>
              <div class="price-field">
                <input
                type="text"
                id="price"
                class="price"
                placeholder="금액"
                name="price"
                maxlength="8"
              />
              <button type="submit" id="btnBuy" class="btn-buy">구입</button>
              </div>
            </form>
            <ul id="priceErrorInfo">
              <li>숫자만 입력해주세요.</li>
              <li>1000원 이상 입력해주세요.</li>
              <li>10,000원 이하로 입력해주세요.</li>
            </ul>
            <div id="resultContainer" class="result-container">

              <p>총 7개를 구매하였습니다.</p>
              <div class="lotto-results-box"></div>
              <p>지난 주 당첨번호 6개와 보너스 번호 1개를 입력해주세요.</p>
   
              <div class="result-form-container">
               <form id="winningForm">
                 <div class="winning-bonus-box">
                 <div class="winning-box">
                   <label>당첨 번호</label>
                   <div>
                     <input type="text" name="winning1" class="winning-number" maxlength='2'>
                     <input type="text" name="winning2" class="winning-number" maxlength='2'>
                     <input type="text" name="winning3" class="winning-number" maxlength='2'>
                     <input type="text" name="winning4" class="winning-number" maxlength='2'>
                     <input type="text" name="winning5" class="winning-number" maxlength='2'>
                     <input type="text" name="winning6" class="winning-number" maxlength='2'>
                   </div>
                 </div>
                 <div class="bonus-box">
                   <label>보너스 번호</label>
                   <div>
                     <input type="text" name="bonus" class="winning-number" maxlength='2'>
                   </div>
                 </div>
               </div>
                <button type="submit" class="btn-lotto-result" id="openModalBtn">결과 확인하기</button>
               </form>
             </div>


            </div>
         

          </div>
        </div>
      </div>

      <footer class="footer">
        <div>Copyright 2023. woowacourse</div>
      </footer>
    </div>
    <script type="module" src="./src/step2-index.js"></script>
    <script src="./src/modal.js" ></script>
  </body>
</html>
